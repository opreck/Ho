name: Runner

on:
  repository_dispatch:
    types: [wisp]

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-multi-models-${{ runner.os }}-${{ hashFiles('**/ollama') }}
          restore-keys: |
            ollama-multi-models-${{ runner.os }}-

      - name: Install
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Install
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Run
        run: |
          pkill ollama || true
          sleep 2
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_ORIGINS="*"
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:7b
          ollama pull gemma2:2b
          ollama pull qwen2.5:1.5b
          ollama pull qwen2.5:0.5b

      - name: Start
        env:
          WORKER_KEY: ${{ secrets.WORKER_API_KEY }}
        run: |
          nohup ./cloudflared tunnel --url http://127.0.0.1:11434 --http-host-header "localhost:11434" > cf.log 2>&1 &
          
          TUNNEL_URL=""
          for i in {1..20}; do
            sleep 2
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cf.log | tail -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          echo "Detected Cloudflare URL: $TUNNEL_URL"

          if [ -n "$TUNNEL_URL" ]; then
            curl -X POST http://node54.lunes.host:3015/register \
              -H "Content-Type: application/json" \
              -H "x-api-key: ${WORKER_KEY:-SuperSecretWorkerKey2026!}" \
              -d "{\"url\": \"$TUNNEL_URL\", \"source\": \"github_runner_${GITHUB_RUN_ID}\"}"
          else
            echo "Failed to retrieve Cloudflare URL"
            cat cf.log
            exit 1
          fi

      - name: Keep
        run: |
          sleep 21300
          
