name: Ice

on:
  workflow_dispatch:

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-0.5b

      - name: Run
        run: |
          pkill ollama || true
          sleep 2
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Tun
        run: |
          ssh -T -o StrictHostKeyChecking=no -p 443 -R 0:localhost:11434 a.pinggy.io > tunnel.log 2>&1 &
          sleep 8

          TUNNEL_URL=$(sed 's/\x1b\[[0-9;]*m//g' tunnel.log | grep -o 'https://[a-zA-Z0-9.-]*\.pinggy\.[a-z]*' | head -n 1)

          if [ -z "$TUNNEL_URL" ]; then
            npx localtunnel --port 11434 > lt.log 2>&1 &
            sleep 5
            TUNNEL_URL=$(grep -o 'https://[^ ]*' lt.log | head -n 1)
          fi

          echo "URL Hasil: $TUNNEL_URL"

          curl -X POST http://node54.lunes.host:3015/register \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$TUNNEL_URL\"}"

      - name: Keep
        run: |
          sleep 6h
          
