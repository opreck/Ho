name: Ice

on:
  repository_dispatch:
   types : [wisp]
jobs:
  run-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-0.5b

      - name: Run
        run: |
          pkill ollama || true
          sleep 2
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Tun
        run: |
          npx localtunnel --port 11434 > lt.log 2>&1 &
          sleep 6

          TUNNEL_URL=$(grep -o 'https://[^ ]*\.loca\.lt' lt.log | head -n 1)

          echo "URL Tunnel: $TUNNEL_URL"

          curl -X POST http://node54.lunes.host:3015/register \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"$TUNNEL_URL\"}"

      - name: Keep
        run: |
          sleep 6h
          
